<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e6f4f2"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Portrait silhouette -->
  <circle cx="460" cy="340" r="120" fill="#d7e3ee"/>
  <ellipse cx="460" cy="560" rx="170" ry="220" fill="#d7e3ee"/>

  <!-- Camera / eye motif -->
  <rect x="600" y="250" width="240" height="180" rx="24" fill="#ffffff" stroke="#c9d8e6" stroke-width="3"/>
  <circle cx="720" cy="340" r="70" fill="#0b1f3f"/>
  <circle cx="720" cy="340" r="48" fill="#123b5f"/>
  <circle cx="720" cy="340" r="26" fill="#1c7f8f"/>
  <circle cx="720" cy="340" r="12" fill="#2fd0c2"/>
  <circle cx="720" cy="338" r="4" fill="#ffffff"/>
  <rect x="726" y="250" width="20" height="70" rx="10" fill="#c9d8e6"/>

  <!-- Accent line -->
  <rect x="380" y="660" width="440" height="5" rx="2.5" fill="url(#acc)"/>

  <!-- Placeholder label -->
  <text x="600" y="730" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#334155">Rural screening image</text>
  <text x="600" y="766" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#64748b">Replace with Indian rural healthcare photo</text>
